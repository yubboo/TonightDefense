name: TonightDefense Safety Gate

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  static-safety:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: TonightDefense source / Cocos meta / regression gate
        shell: powershell
        run: .\scripts\github\check-project.ps1 -Mode Repository -ProjectRoot "${{ github.workspace }}"
